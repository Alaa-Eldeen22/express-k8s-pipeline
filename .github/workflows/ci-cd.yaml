name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Ensure only one deployment runs at a time per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set least-privilege permissions
permissions:
  contents: read

jobs:
  test-build-push:
    name: Test, Build, and Push
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node 20 with npm cache
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies using npm ci
      - name: Install dependencies
        run: npm ci

      # 4. Run tests and fail the pipeline if they fail
      - name: Run unit tests
        run: npm test

      # 5. Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Setup Docker Buildx to enable advanced build features like caching
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Build and push image to private repo with SHA and latest tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/express-k8s-pipeline:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/express-k8s-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: test-build-push
    steps:
      # 1. Checkout code to get the k8s manifests
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create or update the regcred image pull secret
      - name: Create regcred Secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --docker-email=github-actions@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      # 3. Inject the immutable commit-SHA image tag into the manifest.
      #    Doing this before apply (instead of `kubectl set image` after) means every
      #    rollout revision points at a real image, so `rollout undo` is always safe.
      - name: Set deployment image
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/express-k8s-pipeline:${{ github.sha }}|" k8s/deployment.yaml
          grep -n "image:" k8s/deployment.yaml

      # 4. Apply Kubernetes manifests (ConfigMap, Deployment, Service, HPA)
      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      # 5. Check the rollout status with a timeout of 120 seconds
      - name: Wait for rollout status
        id: rollout
        run: kubectl rollout status deployment/myapp --timeout=120s
        continue-on-error: true

      # 6. If the rollout failed, undo the deployment and exit with a failure code
      - name: Rollback deployment on failure
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "Rollout failed! Reverting to the previous state..."
          kubectl rollout undo deployment/myapp
          exit 1

      # 7. Print the current pods in the namespace
      - name: List pods
        run: kubectl get pods
