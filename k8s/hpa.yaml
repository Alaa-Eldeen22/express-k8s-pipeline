apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      # Aggressive scale up for testing/demo (0s delay)
      stabilizationWindowSeconds: 0
    scaleDown:
      # Scale down stabilization to prevent rapid thrashing
      stabilizationWindowSeconds: 120
